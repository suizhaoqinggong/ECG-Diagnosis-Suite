services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecg-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER:-ecg}:${MYSQL_PASSWORD:-ecg123456}@db:3306/${MYSQL_DATABASE:-ecg_db}
      - DEVICE=${BACKEND_DEVICE:-cpu}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecg-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecg-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecg-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # MySQL database
  db:
    image: mysql:8.4
    container_name: ecg-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecg_db}
      MYSQL_USER: ${MYSQL_USER:-ecg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecg123456}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecg-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# Networks
networks:
  ecg-network:
    driver: bridge

# Volumes
volumes:
  mysql_data:
