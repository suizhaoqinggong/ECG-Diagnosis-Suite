version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecg-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+asyncmy://ecg:ecg123456@db:3306/ecg_db
      - REDIS_URL=redis://redis:6379/0
      - DEVICE=cpu
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ecg-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecg-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecg-network
    restart: unless-stopped

  # MySQL database
  db:
    image: mysql:8.4
    container_name: ecg-db
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ecg_db
      MYSQL_USER: ecg
      MYSQL_PASSWORD: ecg123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecg-network
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: ecg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecg-network
    restart: unless-stopped

# Networks
networks:
  ecg-network:
    driver: bridge

# Volumes
volumes:
  mysql_data:
  redis_data:
