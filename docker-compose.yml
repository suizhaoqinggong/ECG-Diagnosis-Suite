version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecg-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ecg:password@db:5432/ecg_db
      - REDIS_URL=redis://redis:6379/0
      - DEVICE=cpu
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - ecg-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecg-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecg-network
    restart: unless-stopped

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: ecg-db
    environment:
      POSTGRES_USER: ecg
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ecg-network
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: ecg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecg-network
    restart: unless-stopped

# Networks
networks:
  ecg-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
  redis_data:
